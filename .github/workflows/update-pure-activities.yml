name: Refresh Pure activities

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 0"
  push:
    paths:
      - "scripts/fetch-pure-activities.mjs"
      - "pure-activities-config.json"
      - ".github/workflows/update-pure-activities.yml"

permissions:
  contents: write

concurrency:
  group: refresh-pure-activities
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Refresh public Pure activities
        run: node scripts/fetch-pure-activities.mjs

      - name: Commit refreshed activities.json
        run: |
          if git diff --quiet activities.json; then
            echo "No activity changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activities.json
          git commit -m "Refresh public Pure activities"
          git push
