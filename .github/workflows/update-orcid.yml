name: Refresh ORCID publications

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    paths:
      - "scripts/fetch-orcid.mjs"
      - "publication-config.json"
      - ".github/workflows/update-orcid.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Fetch and enrich complete ORCID works record
        env:
          ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
        run: node scripts/fetch-orcid.mjs

      - name: Commit refreshed publications.json
        run: |
          if git diff --quiet publications.json activities.json; then
            echo "No publication changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.json activities.json
          git commit -m "Refresh ORCID publications and lectures"
          git push
